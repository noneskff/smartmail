services:
  - type: web
    name: smartmail
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartmail-db
          property: connectionString

databases:
  - name: smartmail-db
    plan: free
    databaseName: smartmail
    user: smartmail_user
